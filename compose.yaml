# Levanta la aplicación y su base de datos PostgreSQL:
#   docker compose up --build -d
# Los valores sensibles se leen del archivo .env (copia .env.example a .env).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bienestar_eventos}
      POSTGRES_USER: ${POSTGRES_USER:-bienestar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en el archivo .env}
    volumes:
      - pgdata:/var/lib/postgresql/data     # los datos sobreviven a "docker compose down"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # La base NO se publica al exterior: solo la app la alcanza por la red interna.
    # Para verla con pgAdmin desde tu PC, descomenta (solo en tu máquina):
    # ports:
    #   - "127.0.0.1:5433:5432"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      # Por defecto usa la base del contenedor "db". Si defines COMPOSE_DATABASE_URL en .env
      # (por ejemplo la URL de Neon), usará esa base en su lugar.
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgresql://${POSTGRES_USER:-bienestar}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-bienestar_eventos}}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en el archivo .env}
      JWT_EXPIRA_EN: ${JWT_EXPIRA_EN:-8h}
      LOGIN_LIMITE: ${LOGIN_LIMITE:-30}
      # Contraseñas de los usuarios de ejemplo (obligatorias: así no se usan las públicas del README)
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Define ADMIN_PASSWORD en el archivo .env}
      BIENESTAR_PASSWORD: ${BIENESTAR_PASSWORD:?Define BIENESTAR_PASSWORD en el archivo .env}
      ESTUDIANTE_PASSWORD: ${ESTUDIANTE_PASSWORD:?Define ESTUDIANTE_PASSWORD en el archivo .env}

volumes:
  pgdata:
